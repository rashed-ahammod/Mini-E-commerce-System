# Render Blueprint — creates the API service.
#
# Use it with Render's "New → Blueprint" and point it at this repository.
# Everything here can also be configured by hand in the dashboard; the file
# just makes it reproducible.
#
# The database is NOT created by Render: this project uses Neon (managed
# Postgres, free tier, no expiry date). Render's own free Postgres expires
# 30 days after it is created, which would quietly break a deployment that
# has to stay reachable. Create the Neon project first and paste its
# connection string in when Render asks for DATABASE_URL.
# Full walkthrough: DEPLOYMENT.md

services:
  - type: web
    name: mini-ecommerce-api
    runtime: python
    plan: free
    # The Django project is not at the repository root.
    rootDir: backend
    buildCommand: "./render-build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --log-file -"
    # A dedicated liveness probe. It does no database work and is exempt
    # from the HTTPS redirect, because Render's health check reaches the
    # container over plain HTTP and would otherwise receive a 301.
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"

      # Generated once by Render and kept secret. settings.py refuses to boot
      # with the development key when DEBUG is off, so this must exist.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      # ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS pick up Render's own
      # RENDER_EXTERNAL_HOSTNAME automatically (see config/settings.py), so
      # the service URL does not have to be copied in by hand.

      # Neon connection string, including ?sslmode=require.
      # `sync: false` means Render prompts for it rather than storing a
      # secret in this file. Use the DIRECT string, not the "-pooler" one,
      # unless you also set DJANGO_DB_DISABLE_SERVER_SIDE_CURSORS below.
      - key: DATABASE_URL
        sync: false

      # Neon suspends a database that has been idle, so a connection held
      # open between requests can be dead by the time it is reused. Opening
      # one per request avoids that; Neon's connect time is a few ms.
      - key: DJANGO_DB_CONN_MAX_AGE
        value: "0"

      # Only needed if DATABASE_URL is a pooled ("-pooler") Neon string.
      # A transaction-mode pooler gives each transaction a different backend
      # connection, so server-side cursors have no session to live in.
      - key: DJANGO_DB_DISABLE_SERVER_SIDE_CURSORS
        value: "False"

      # The deployed Vercel URL, e.g. https://mini-e-commerce-system-one.vercel.app
      # Set it after the frontend's first deploy.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Optional. A regex for Vercel preview URLs, which change per commit.
      # Keep it scoped to your own project name, never a bare .vercel.app
      # pattern, or any site on vercel.app could call this API from a
      # visitor's browser. Example:
      #   ^https://mini-ecommerce-[a-z0-9-]+\.vercel\.app$
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        sync: false

      # Set to "true" for the first deploy to load the sample catalog, then
      # back to "false". The seed command is safe to run repeatedly.
      - key: SEED_DATA
        value: "false"

      # Optional: fill all three to have the build create an admin account,
      # since the Free plan has no shell to run createsuperuser in.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

# No `databases:` block on purpose — see the note at the top of this file.
# To use Render's own Postgres instead (and accept the 30-day expiry), add:
#
# databases:
#   - name: mini-ecommerce-db
#     plan: free
#     databaseName: mini_ecommerce
#     user: mini_ecommerce
#
# and change the DATABASE_URL entry above to:
#
#   - key: DATABASE_URL
#     fromDatabase:
#       name: mini-ecommerce-db
#       property: connectionString
#
# Nothing in the application code changes either way.
